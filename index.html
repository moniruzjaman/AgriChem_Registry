<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AgriChem · Pesticide Field Guide</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"AgriChem Field Guide","short_name":"AgriChem","display":"standalone","background_color":"#0f3d2e","theme_color":"#0f3d2e","start_url":"./","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><rect width=%22512%22 height=%22512%22 rx=%2296%22 fill=%22%230f3d2e%22/><path d=%22M256 96 C 360 96 416 168 416 264 C 416 376 336 432 256 432 C 200 432 160 392 160 344 C 160 296 200 264 256 264 C 296 264 320 288 320 320%22 fill=%22none%22 stroke=%22%237dd3a0%22 stroke-width=%2228%22/><path d=%22M256 152 V 372%22 stroke=%22%23e8f5ec%22 stroke-width=%2222%22/></svg>","sizes":"any","type":"image/svg+xml"}]}' />
<style>
:root{--bg:#f8fafc;--panel:#fff;--bg2:#f1f5f9;--ink:#0f172a;--ink-dim:#64748b;--line:#e2e8f0;--accent:#0f3d2e;--accent-light:#dcfce7;--accent2:#15803d;--red:#dc2626;--red-light:#fee2e2;--amber:#d97706;--amber-light:#fef3c7;--blue:#2563eb;--blue-light:#dbeafe;--purple:#9333ea;--purple-light:#f3e8ff;--radius:16px;--shadow:0 4px 6px -1px rgba(0,0,0,.05);--serif:Georgia,'Times New Roman',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);padding:12px 16px;border-bottom:1px solid var(--line);padding-top:max(12px,env(safe-area-inset-top));box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand svg{width:32px;height:32px;border-radius:8px}
.brand h1{font:700 18px var(--serif);margin:0;color:var(--accent)}
.brand .sub{font:600 11px var(--sans);color:var(--ink-dim)}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);padding:14px 14px 14px 44px;border-radius:12px;font:500 15px var(--sans)}
.search input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px var(--accent-light)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4}
.content{padding:16px 16px 80px;max-width:1200px;margin:0 auto}
.filter-bar{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;margin-bottom:12px}
.filter-bar::-webkit-scrollbar{display:none}
.filter-select{background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:10px;font:600 13px var(--sans);color:var(--ink);cursor:pointer;white-space:nowrap}
.filter-select.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.moa-group{margin-bottom:24px}
.moa-header{font:800 14px var(--sans);color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--accent-light);display:flex;justify-content:space-between}
.moa-header span{font:600 10px var(--sans);color:var(--ink-dim);background:#fff;padding:2px 6px;border-radius:4px;border:1px solid var(--line)}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:transform .1s;box-shadow:var(--shadow)}
.card:active{transform:scale(.98)}
.card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.card .trade{font:700 15px var(--serif);color:var(--ink);line-height:1.2}
.card .common{font:400 12px var(--sans);color:var(--ink-dim);font-style:italic;margin-top:2px}
.card .tier-badge{font:700 9px var(--sans);padding:4px 8px;border-radius:4px;text-transform:uppercase;white-space:nowrap}
.tier-red{background:var(--red-light);color:var(--red)}
.tier-amber{background:var(--amber-light);color:var(--amber)}
.tier-green{background:var(--accent-light);color:var(--accent2)}
.tier-slate{background:var(--bg2);color:var(--ink-dim)}
.card .meta{font:400 11px var(--sans);color:var(--ink-dim);margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.badge{padding:3px 6px;border-radius:4px;font-weight:600;border:1px solid var(--line);cursor:pointer}
.badge.moa{background:var(--blue-light);color:var(--blue);border-color:var(--blue-light)}
.badge.common{background:var(--purple-light);color:var(--purple);border-color:var(--purple-light)}
.modal{position:fixed;inset:0;background:rgba(15,61,46,0.6);backdrop-filter:blur(4px);z-index:40;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.modal.show{display:flex;opacity:1}
.sheet{background:#fff;border-radius:20px;max-width:600px;width:92%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 25px -5px rgba(0,0,0,0.2)}
.sheet-head{padding:24px 24px 16px;border-bottom:1px solid var(--line);position:relative}
.sheet-head h2{font:700 22px var(--serif);color:var(--accent);margin:0 0 4px}
.sheet-head .sub{font:400 14px var(--sans);color:var(--ink-dim)}
.sheet-close{position:absolute;top:16px;right:16px;background:var(--bg2);border:none;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;color:var(--ink-dim)}
.sheet-body{padding:20px 24px 32px}
.detail-section{margin-bottom:24px}
.section-title{font:800 12px var(--sans);color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bg2);font:400 14px var(--sans)}
.detail-row:last-child{border-bottom:none}
.detail-row .k{color:var(--ink-dim);font-weight:600;flex:0 0 40%}
.detail-row .v{color:var(--ink);font-weight:500;text-align:right;flex:1}
.tag{display:inline-block;background:var(--bg2);padding:4px 10px;border-radius:6px;font:600 12px var(--sans);color:var(--ink);cursor:pointer}
.tag.link{background:var(--blue-light);color:var(--blue)}
.tag.common-link{background:var(--purple-light);color:var(--purple)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:30}
.nav-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 10px var(--sans);color:var(--ink-dim);cursor:pointer;padding:4px 16px}
.nav-btn.on{color:var(--accent2)}
.nav-btn svg{width:22px;height:22px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#0f3d2e"/><path d="M256 96 C 360 96 416 168 416 264 C 416 376 336 432 256 432 C 200 432 160 392 160 344 C 160 296 200 264 256 264 C 296 264 320 288 320 320" fill="none" stroke="#7dd3a0" stroke-width="28"/><path d="M256 152 V 372" stroke="#e8f5ec" stroke-width="22"/></svg>
    <div><h1>AgriChem Field Guide</h1><div class="sub">DAE Bangladesh · Common Name & MoA Engine</div></div>
  </div>
  <div class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input id="globalSearch" type="search" placeholder="Search Brand, Common Name, MoA, Reg No..." autocomplete="off">
  </div>
</header>

<div class="content" id="view-database">
  <div class="filter-bar">
    <button class="filter-select on" onclick="filterProducts('all', this)">All</button>
    <button class="filter-select" onclick="filterProducts('Insecticide', this)">Insecticide</button>
    <button class="filter-select" onclick="filterProducts('Fungicide', this)">Fungicide</button>
    <button class="filter-select" onclick="filterProducts('Herbicide', this)">Herbicide</button>
    <button class="filter-select" onclick="filterProducts('Bio Pesticide', this)">Bio</button>
  </div>
  <div id="productList"></div>
</div>

<div class="modal" id="detailModal">
  <div class="sheet">
    <div class="sheet-head">
      <button class="sheet-close" onclick="closeModal()">×</button>
      <h2 id="modalTitle"></h2>
      <div class="sub" id="modalSub"></div>
    </div>
    <div class="sheet-body" id="modalBody"></div>
  </div>
</div>

<script src="registry.js"></script>
<script>
let allProducts=[];let currentFilter={type:'all',value:''};let currentSearch='';
function initData(){if(typeof REGISTRY==='undefined')return;const idx={};REGISTRY.cols.forEach((c,i)=>idx[c]=i);allProducts=REGISTRY.rows.map(r=>({reg:r[idx.reg],cat:r[idx.cat],common:r[idx.common]||"N/A",trade:r[idx.trade],moa:r[idx.moa]||"Unmapped",auth:r[idx.auth]||"—",risk:r[idx.risk]||"—",tier:r[idx.tier]||"N/A",hhp:r[idx.hhp]||"",crops:(r[idx.crops]||[]).map(i=>REGISTRY.crops[i]||i),pests:(r[idx.pests]||[]).map(i=>REGISTRY.pests[i]||i)}));renderProducts();}

function renderProducts(){
  const list=document.getElementById('productList');
  let filtered=allProducts.filter(p=>{
    let match=true;
    if(currentFilter.type==='cat')match=match&&(p.cat===currentFilter.value);
    if(currentFilter.type==='moa')match=match&&(p.moa===currentFilter.value);
    if(currentFilter.type==='common')match=match&&(p.common===currentFilter.value);
    if(currentSearch!==''){const hay=[p.trade,p.common,p.reg,p.moa,p.cat].join(' ').toLowerCase();match=match&&hay.includes(currentSearch);}
    return match;
  });
  const grouped={};
  filtered.forEach(p=>{const key=p.moa!=="Unmapped"?`${p.moa} (${p.auth})`:'Unmapped / Unknown MoA';if(!grouped[key])grouped[key]=[];grouped[key].push(p);});
  let html=`<p style="color:var(--ink-dim);font-size:14px;margin-bottom:16px"><b>${filtered.length}</b> products found</p>`;
  for(const moaKey in grouped){
    html+=`<div class="moa-group"><div class="moa-header">${moaKey} <span>${grouped[moaKey].length} Products</span></div><div class="product-grid">`;
    html+=grouped[moaKey].map(p=>`
      <div class="card" onclick="openModal('${p.reg}')">
        <div class="head">
          <div><div class="trade">${p.trade}</div><div class="common">${p.common}</div></div>
          <div class="tier-badge tier-${p.tier.toLowerCase()}">${p.tier}</div>
        </div>
        <div class="meta">
          <span class="badge common" onclick="event.stopPropagation(); filterBy('common', '${p.common.replace(/'/g, "\\'")}');">Active: ${p.common}</span>
          <span class="badge moa" onclick="event.stopPropagation(); filterBy('moa', '${p.moa}');">MoA: ${p.moa}</span>
        </div>
      </div>
    `).join('');
    html+='</div></div>';
  }
  list.innerHTML=html||'<p style="text-align:center;padding:40px;color:#64748b">No products found.</p>';
}

function filterProducts(cat,btn){currentFilter={type:'cat',value:cat};document.querySelectorAll('.filter-select').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');renderProducts();}
function filterBy(type,value){currentFilter={type:type,value:value};document.querySelectorAll('.filter-select').forEach(b=>b.classList.remove('on'));renderProducts();document.getElementById('globalSearch').value='';currentSearch='';window.scrollTo(0,0);}

document.getElementById('globalSearch').addEventListener('input',e=>{currentSearch=e.target.value.trim().toLowerCase();renderProducts();});

function openModal(reg){
  const p=allProducts.find(x=>x.reg===reg);if(!p)return;
  document.getElementById('modalTitle').textContent=p.trade;
  document.getElementById('modalSub').textContent=`Reg № ${p.reg}`;
  document.getElementById('modalBody').innerHTML=`
    <div class="detail-section">
      <div class="section-title">🧪 Product Identity & Chemistry</div>
      <div class="detail-row"><div class="k">Brand Name</div><div class="v" style="font-weight:800">${p.trade}</div></div>
      <div class="detail-row"><div class="k">Common Name</div><div class="v"><span class="tag common-link" onclick="filterBy('common', '${p.common.replace(/'/g, "\\'")}')">${p.common}</span></div></div>
      <div class="detail-row"><div class="k">MoA Category</div><div class="v"><span class="tag link" onclick="filterBy('moa', '${p.moa}')">${p.moa} (${p.auth})</span></div></div>
      <div class="detail-row"><div class="k">Resistance Risk</div><div class="v" style="color:var(--${p.risk.toLowerCase()});font-weight:700">${p.risk}</div></div>
    </div>
    <div class="detail-section">
      <div class="section-title">🌿 Field Application</div>
      <div class="detail-row"><div class="k">Category</div><div class="v">${p.cat}</div></div>
      <div class="detail-row"><div class="k">Policy Tier</div><div class="v" style="color:var(--${p.tier.toLowerCase()});font-weight:700">${p.tier}</div></div>
      <div class="detail-row"><div class="k">Target Crops</div><div class="v">${p.crops.join(', ')}</div></div>
      <div class="detail-row"><div class="k">Target Pests</div><div class="v">${p.pests.join(', ')}</div></div>
    </div>
  `;
  document.getElementById('detailModal').classList.add('show');
}
function closeModal(){document.getElementById('detailModal').classList.remove('show');}
document.getElementById('detailModal').addEventListener('click',e=>{if(e.target.id==='detailModal')closeModal();});
initData();
</script>
</body>
</html>
